<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TensorFlow.js 画像認識（超軽量・爆速読み込み版）</title>
    <!-- ① TensorFlow.js 本体と、超軽量モデル(MobileNet)を読み込む（容量合計わずか数MB） -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #img-container { margin: 20px 0; }
        #preview-canvas { max-width: 400px; border: 1px solid #ccc; display: none; }
    </style>
</head>
<body>

    <h1>TensorFlow.js 画像認識（超軽量・爆速版）</h1>
    
    <input type="file" id="image-selector" accept="image/*" disabled>
    <span id="load-status">モデルを読み込み中...</span>

    <div id="img-container">
        <canvas id="preview-canvas"></canvas>
    </div>
    
    <div id="result"></div>

    <script>
        // 主要なMobileNetクラス名の日本語マッピング（一部抜粋。ヒットしない場合は英語で表示）
        const translations = {
            "tabby, tabby cat": "トラ猫", "Egyptian cat": "エジプト猫", "Persian cat": "ペルシャ猫",
            "golden retriever": "ゴールデンレトリバー", "German shepherd, German shepherd dog, German police dog, alsatian": "ジャーマンシェパード",
            "Labrador retriever": "ラブラドールレトリバー", "Chihuahua": "チワワ", "Pomeranian": "ポメラニアン",
            "sports car, sport car": "スポーツカー", "convertible": "オープンカー", "minivan": "ミニバン", "pickup, pickup truck": "ピックアップトラック",
            "beach wagon, station wagon, wagon, estate car, beach waggon, station waggon, waggon": "ステーションワゴン",
            "passenger car, coach, carriage": "客車/乗用車", "racer, race car, racing car": "レーシングカー",
            "mountain bike, mountain bicycle": "マウンテンバイク", "folding bicycle": "折りたたみ自転車",
            " airliner": "旅客機", "warplane, military plane": "軍用機", "space shuttle": "スペースシャトル",
            "banana": "バナナ", "granny smith": "青リンゴ", "orange": "オレンジ", "lemon": "レモン", "pineapple, ananas": "パイナップル",
            "strawberry": "イチゴ", "cheeseburger": "チーズバーガー", "hotdog, hot dog, red hot": "ホットドッグ", "pizza, pizza pie": "ピザ",
            "espresso": "エスプレッソ", "red wine": "赤ワイン", "coffee mug": "コーヒーカップ",
            "laptop, laptop computer": "ノートパソコン", "desktop computer": "デスクトップPC", "monitor": "モニター",
            "cellular telephone, cellular phone, cellphone, cell, mobile phone": "携帯電話/スマホ",
            "television, television system": "テレビ", "mouse, computer mouse": "マウス", "keyboard, computer keyboard": "キーボード",
            "acoustic guitar": "アコースティックギター", "electric guitar": "エレキギター", "grand piano, grand": "グランドピアノ",
            "desk": "机", "rocking chair, rocker": "ロッキングチェア", "barber chair": "理髪店の椅子", "folding chair": "折りたたみ椅子",
            "velvet": "ベルベット/ソファ", "studio couch, daybed": "ソファベッド",
            "ballpoint, ballpoint pen, ballpen": "ボールペン", "fountain pen": "万年筆", "notebook, notebook computer": "ノート/手帳"
        };

        let model;
        const imageSelector = document.getElementById('image-selector');
        const loadStatus = document.getElementById('load-status');
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        const resultDiv = document.getElementById('result');

        async function init() {
            // ★ 高速化：超軽量モデルのロード（COCO-SSDより圧倒的に早い）
            model = await mobilenet.load();
            loadStatus.innerText = "準備完了！画像を選択してください。";
            imageSelector.disabled = false;
        }

        imageSelector.addEventListener('change', (e) => {
            const file = e.target.files;
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = async () => {
                    // 画像のリサイズ処理
                    const maxW = 400;
                    const scale = maxW / img.width;
                    canvas.width = maxW;
                    canvas.height = img.height * scale;
                    
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    canvas.style.display = 'block';
                    resultDiv.innerHTML = "認識中...";

                    // 軽量モデルで高速予測
                    const predictions = await model.classify(canvas);

                    // 結果表示
                    resultDiv.innerHTML = "<h3>認識結果（確率の高い順）:</h3>";
                    predictions.forEach(p => {
                        // 辞書にあれば日本語、なければ英語のまま（最初の候補を取得）
                        const engClassName = p.className.split(',')[0];
                        const japaneseClass = translations[p.className] || translations[engClassName] || p.className;
                        resultDiv.innerHTML += `<p>🚀 <b>${japaneseClass}</b> - 確率: ${(p.probability * 100).toFixed(1)}%</p>`;
                    });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        window.onload = init;
    </script>
</body>
</html>
